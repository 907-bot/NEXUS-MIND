services:
  - type: web
    name: nexusmind-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: starter
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false  # Set manually in Render dashboard from REDIS_URL Key Value service
      - key: DATABASE_URL
        fromDatabase:
          name: nexusmind-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWT_ISSUER
        sync: false
      - key: CORS_ORIGINS
        value: "https://907-bot.github.io,https://907-bot.github.io/NEXUS-MIND,https://907-bot.github.io/NEXUS-MIND/"

  # Key Value service REDIS_URL already created manually in Render dashboard

databases:
  - name: nexusmind-db
    plan: starter
